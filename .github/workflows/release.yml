name: Release build

on:
  push:
    branches:
      - master

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  qa:
    name: QA gate
    uses: ./.github/workflows/qa.yml

  release:
    name: Build and publish release
    needs: qa
    environment: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Android NDK and CMake
        run: |
          set -euo pipefail
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.2.12479018" \
            "cmake;3.22.1" \
            --channel=0

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret. Release builds must be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/showtimeplayer-release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/showtimeplayer-release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Compute version
        run: |
          set -euo pipefail
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION_NAME}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APK_NAME=ShowtimePlayer-${VERSION_NAME}.apk" >> "$GITHUB_ENV"
          echo "AAB_NAME=ShowtimePlayer-${VERSION_NAME}.aab" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Rename release artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release/${{ env.APK_NAME }}"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/release/${{ env.AAB_NAME }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TAG }}
          TITLE: ${{ env.VERSION_NAME }}
          APK_NAME: ${{ env.APK_NAME }}
          AAB_NAME: ${{ env.AAB_NAME }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "$RUNNER_TEMP/release/$APK_NAME" \
            "$RUNNER_TEMP/release/$AAB_NAME" \
            --title "$TITLE" \
            --generate-notes
